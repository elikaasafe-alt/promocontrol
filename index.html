        const getSafeStorage = (key, fallback) => {
            try {
                const item = localStorage.getItem(key);
                if (item) {
                    const parsed = JSON.parse(item);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    if (typeof parsed === 'object' && parsed !== null) return parsed;
                    if (typeof parsed === 'string' && parsed.trim()) return parsed;
                }
            } catch (e) {}
            return fallback;
        };

        const compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('Erro na compressão'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        };

                    const data = snapshot.val();

                        setVisitas(Array.isArray(data.visitas) ? data.visitas : []);
                        setPromotores(Array.isArray(data.promotores) && data.promotores.length > 0 ? data.promotores : initialPromotoresExtracao);
                        setResponsaveis(Array.isArray(data.responsaveis) && data.responsaveis.length > 0 ? data.responsaveis : defaultResponsaveis);
                        setLixeira(Array.isArray(data.lixeira) ? data.lixeira : []);
                        if (data.senhaAdmin) setSenhaAdmin(data.senhaAdmin);
                    } else {
                        sincronizarFirebase(visitas, initialPromotoresExtracao, responsaveis, lixeira, senhaAdmin);
                    }
                };

                dbRef.on('value', handleDataChange);

                return () => {
                    if (dbRef) dbRef.off('value', handleDataChange);
                };
            }, []);

                if (seletorAberto && buscaInputRef.current) {

                }
            }, [seletorAberto]);

                if (!dbRef) return;

                const payload = {
                    visitas: v !== undefined ? v : visitas,
                    promotores: p !== undefined ? p : (promotores.length > 0 ? promotores : initialPromotoresExtracao),
                    responsaveis: r !== undefined ? r : (responsaveis.length > 0 ? responsaveis : defaultResponsaveis),

                    senhaAdmin: sAdmin !== undefined ? sAdmin : senhaAdmin,
                    updatedAt: Date.now()

                    console.error("Erro ao sincronizar Firebase:", err);
                });
            };

                return [...lista].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));

                e.preventDefault();

                    return;
                }

                const promotor = promotoresDisponiveis.find(p => p.id === promotorSelecionadoId);
                if (!promotor) return;

                const jaEstaAtivo = visitasAtivas.some(v => v.promotorId === promotor.id);
                if (jaEstaAtivo) {
                    mostrarNotificacao(`O promotor ${promotor.nome} já possui uma entrada ativa!`);

                    promotorId: promotor.id,
                    nome: promotor.nome,
                    empresa: promotor.empresa,

                    status: 'ativo',
                    saidaIso: null,
                    duracaoMs: null,
                    responsavelSaida: null,
                    fotoSaidaUrl: null
                };

                const visitasAtualizadas = [novaVisita, ...visitas];
                updateVisitas(visitasAtualizadas);
                setPromotorSelecionadoId('');
                setTermoBuscaPromotor('');
                mostrarNotificacao(`Entrada registrada para ${promotor.nome}!`);

                const file = e.target.files[0];
                if (!file) return;

                try {
                    setModalSaida(prev => ({ ...prev, enviandoFoto: true }));
                    const compressedBlob = await compressImage(file, 800, 0.7);

                    const base64String = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(compressedBlob);
                    });

                    setModalSaida(prev => ({
                        ...prev,
                        fotoPreview: base64String,
                        fotoBase64: base64String,
                        enviandoFoto: false,
                        erroSenha: ''
                    }));
                } catch (err) {
                    console.error("Erro ao processar imagem:", err);
                    setModalSaida(prev => ({
                        ...prev,
                        enviandoFoto: false,
                        erroSenha: 'Erro ao capturar imagem. Tente novamente.'
                    }));
                }
            };

            const confirmarSaida = (e) => {
                if (e) e.preventDefault();
                if (!modalSaida.visita) return;

                if (!modalSaida.fotoBase64) {
                    setModalSaida(prev => ({ ...prev, erroSenha: 'É obrigatório tirar a foto do promotor antes de digitar a senha!' }));
                    return;
                }

                const senhaDigitada = modalSaida.senhaDigitada.trim();
                if (!senhaDigitada) {
                    setModalSaida(prev => ({ ...prev, erroSenha: 'Digite a senha do responsável pela saída!' }));
                    return;
                }

                let nomeResp = null;
                const respEncontrado = responsaveisDisponiveis.find(r => r.senha === senhaDigitada);

                if (respEncontrado) {
                    nomeResp = respEncontrado.nome;
                } else if (senhaDigitada === senhaAdmin) {
                    nomeResp = 'Administrador';
                } else {
                    setModalSaida(prev => ({ ...prev, erroSenha: 'Senha incorreta ou não autorizada!' }));
                    return;
                }

                const agora = new Date();
                const entrada = new Date(modalSaida.visita.entradaIso);
                const duracao = agora.getTime() - entrada.getTime();

                const visitasAtualizadas = visitas.map(v => {
                    if (v.id === modalSaida.visita.id) {
                        return {
                            ...v,
                            saidaIso: agora.toISOString(),
                            duracaoMs: duracao,
                            status: 'concluido',
                            responsavelSaida: nomeResp,
                            fotoSaidaUrl: modalSaida.fotoBase64
                        };
                    }
                    return v;
                });

                updateVisitas(visitasAtualizadas);
                mostrarNotificacao(`Saída com foto autorizada por ${nomeResp}!`);
                setModalSaida({ open: false, visita: null, fotoPreview: null, fotoBase64: null, enviandoFoto: false, senhaDigitada: '', erroSenha: '', verSenha: false });
            };

            const handleCadastrarPromotor = (e) => {
                e.preventDefault();
                if (!novoPromotor.nome.trim() || !novoPromotor.empresa.trim()) {
                    mostrarNotificacao('Preencha o nome do promotor e a empresa!');
                    return;
                }

                if (novoPromotor.senhaConfirmacao !== senhaAdmin) {
                    mostrarNotificacao('Senha de Administrador incorreta! Cadastro negado.');
                    return;
                }

                const item = {
                    id: Date.now().toString(),
                    nome: novoPromotor.nome.trim().toUpperCase(),
                    empresa: novoPromotor.empresa.trim().toUpperCase()
                };

                const novaLista = [...promotoresDisponiveis, item];
                updatePromotores(novaLista);
                setNovoPromotor({ nome: '', empresa: '', senhaConfirmacao: '' });
                mostrarNotificacao(`Promotor "${item.nome}" cadastrado com sucesso!`);
            };

            const handleExcluirPromotor = (id) => {
                const novaLista = promotoresDisponiveis.filter(p => p.id !== id);
                updatePromotores(novaLista);
                mostrarNotificacao("Promotor excluído!");
            };

            const handleCadastrarResponsavel = (e) => {
                e.preventDefault();
                if (!novoResponsavel.nome.trim() || !novoResponsavel.senha.trim()) {
                    mostrarNotificacao('Preencha o nome e a senha do responsável!');
                    return;
                }

                const jaExiste = responsaveisDisponiveis.find(r => r.senha === novoResponsavel.senha.trim());
                if (jaExiste) {
                    mostrarNotificacao('Esta senha já pertence a outro responsável.');
                    return;
                }

                const item = {
                    id: Date.now().toString(),
                    nome: novoResponsavel.nome.trim(),
                    senha: novoResponsavel.senha.trim()
                };

                const novaLista = [...responsaveisDisponiveis, item];
                updateResponsaveis(novaLista);
                setNovoResponsavel({ nome: '', senha: '', verSenha: false });
                mostrarNotificacao(`Responsável "${item.nome}" cadastrado!`);
            };

            const handleExcluirResponsavel = (id) => {
                const novaLista = responsaveisDisponiveis.filter(r => r.id !== id);
                updateResponsaveis(novaLista);
                mostrarNotificacao("Responsável excluído!");
            };

            const handleAlterarSenhaAdmin = (e) => {
                e.preventDefault();
                const { senhaAtual, novaSenha, confirmacao } = formSenhaAdmin;

                if (senhaAtual !== senhaAdmin) {
                    setFormSenhaAdmin(prev => ({ ...prev, erro: 'Senha atual incorreta!', sucesso: '' }));
                    return;
                }
                if (!novaSenha || novaSenha.length < 4) {
                    setFormSenhaAdmin(prev => ({ ...prev, erro: 'A nova senha deve ter pelo menos 4 caracteres!', sucesso: '' }));
                    return;
                }
                if (novaSenha !== confirmacao) {
                    setFormSenhaAdmin(prev => ({ ...prev, erro: 'As senhas não coincidem!', sucesso: '' }));
                    return;
                }

                setSenhaAdmin(novaSenha);
                sincronizarFirebase(undefined, undefined, undefined, undefined, novaSenha);
                setFormSenhaAdmin({ senhaAtual: '', novaSenha: '', confirmacao: '', verSenha: false, erro: '', sucesso: 'Senha de Administrador alterada com sucesso!' });
                mostrarNotificacao('Senha de Administrador alterada!');
            };

            const moverParaLixeira = (visita) => {
                setModalAdmin({ 
                    open: true, 
                    acaoAba: null, 
                    itemParaLixeira: visita, 
                    senhaDigitada: '', 
                    erro: '', 
                    verSenha: false 
                });
            };

            const restaurarDaLixeira = (visita) => {
                const novaLixeira = lixeira.filter(l => l.id !== visita.id);
                const novasVisitas = [visita, ...visitas];

                setLixeira(novaLixeira);
                setVisitas(novasVisitas);
                sincronizarFirebase(novasVisitas, undefined, undefined, novaLixeira, undefined);
                mostrarNotificacao(`Registro restaurado.`);
            };

            const excluirDefinitivo = (visitaId) => {
                const novaLixeira = lixeira.filter(l => l.id !== visitaId);
                setLixeira(novaLixeira);
                sincronizarFirebase(undefined, undefined, undefined, novaLixeira, undefined);
                mostrarNotificacao('Registro excluído permanentemente.');
            };

            const baixarBackupCompleto = () => {
                const dataBackup = {
                    dataExportacao: new Date().toISOString(),
                    senhaAdmin,
                    promotores: promotoresDisponiveis,
                    responsaveis: responsaveisDisponiveis,
                    visitas,
                    lixeira
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataBackup, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `PromoControl_Backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                mostrarNotificacao("Backup completo baixado com sucesso!");
            };

            const restaurarBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.promotores || parsed.visitas || parsed.responsaveis) {
                            const newP = Array.isArray(parsed.promotores) ? parsed.promotores : promotoresDisponiveis;
                            const newR = Array.isArray(parsed.responsaveis) ? parsed.responsaveis : responsaveisDisponiveis;
                            const newV = Array.isArray(parsed.visitas) ? parsed.visitas : visitas;
                            const newL = Array.isArray(parsed.lixeira) ? parsed.lixeira : lixeira;
                            const newS = parsed.senhaAdmin || senhaAdmin;

                            setPromotores(newP);
                            setResponsaveis(newR);
                            setVisitas(newV);
                            setLixeira(newL);
                            setSenhaAdmin(newS);

                            sincronizarFirebase(newV, newP, newR, newL, newS);
                            mostrarNotificacao("Backup restaurado com sucesso!");
                        } else {
                            mostrarNotificacao("Arquivo de backup inválido.", "erro");
                        }
                    } catch (err) {
                        console.error(err);
                        mostrarNotificacao("Erro ao ler o arquivo de backup.", "erro");
                    }
                };
                reader.readAsText(file);
            };

            const exportarExcel = () => {
                try {
                    if (typeof XLSX === 'undefined') {
                        mostrarNotificacao("Biblioteca Excel está carregando. Tente novamente em alguns segundos.", "erro");
                        return;
                    }

                    if (!visitasConcluidas || visitasConcluidas.length === 0) {
                        mostrarNotificacao("Não há atendimentos concluídos para exportar.", "erro");
                        return;
                    }

                    const dadosExcel = visitasConcluidas.map(v => ({
                        'Promotor': v.nome || 'N/A',
                        'Empresa': v.empresa || 'N/A',
                        'Data': formatarData(v.entradaIso),
                        'Entrada': formatarHora(v.entradaIso),
                        'Saída': formatarHora(v.saidaIso),
                        'Permanência': formatarDuracao(v.duracaoMs),
                        'Responsável Saída': v.responsavelSaida || 'N/A',
                        'Foto de Comprovação': v.fotoSaidaUrl ? 'Sim (Clique no App)' : 'Sem Foto'
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(dadosExcel);
                    
                    worksheet['!cols'] = [
                        { wch: 20 },
                        { wch: 25 },
                        { wch: 12 },
                        { wch: 10 },
                        { wch: 10 },
                        { wch: 15 },
                        { wch: 20 },
                        { wch: 22 }
                    ];

                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Atendimentos");
                    
                    const nomeArquivo = `PromoControl_Relatorio_${new Date().toISOString().slice(0,10)}.xlsx`;
                    XLSX.writeFile(workbook, nomeArquivo);
                    
                    mostrarNotificacao("Relatório exportado em Excel com sucesso!");
                } catch (err) {
                    console.error("Erro ao gerar Excel:", err);
                    mostrarNotificacao("Erro ao gerar arquivo Excel. Tente novamente.", "erro");
                }
            };

            const gerarPDF = () => {
                window.print();
            };

            const confirmarLoginAdmin = (e) => {
                if (e) e.preventDefault();
                if (modalAdmin.senhaDigitada === senhaAdmin) {
                    if (modalAdmin.itemParaLixeira) {
                        const item = modalAdmin.itemParaLixeira;
                        setModalAdmin({ open: false, acaoAba: null, itemParaLixeira: null, senhaDigitada: '', erro: '', verSenha: false });
                        
                        const novasVisitas = visitas.filter(v => v.id !== item.id);
                        const novaLixeira = [item, ...lixeira];
                        setVisitas(novasVisitas);
                        setLixeira(novaLixeira);
                        sincronizarFirebase(novasVisitas, undefined, undefined, novaLixeira, undefined);
                        mostrarNotificacao(`Registro enviado para a lixeira.`);
                        return;
                    }

                    setAdminAutenticado(true);
                    setAbaAtiva(modalAdmin.acaoAba || 'relatorios');
                    setModalAdmin({ open: false, acaoAba: null, itemParaLixeira: null, senhaDigitada: '', erro: '', verSenha: false });
                    setMenuAberto(false);
                    mostrarNotificacao('Acesso de Administrador concedido!');
                } else {
                    setModalAdmin(prev => ({ ...prev, erro: 'Senha de Administrador incorreta!' }));
                }
            };

            const formatarHora = (iso) => {
                if (!iso) return '--:--';
                const d = new Date(iso);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            };

            const formatarData = (iso) => {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString('pt-BR');
            };

            const formatarDuracao = (ms) => {
                if (!ms || ms < 0) return '0 min';
                const totalMinutos = Math.floor(ms / (1000 * 60));
                const horas = Math.floor(totalMinutos / 60);
                const minutos = totalMinutos % 60;
                if (horas > 0) return `${horas}h ${minutos}m`;
                return `${minutos} min`;
            };

            const gerarTextoRelatorio = () => {
                let txt = `📊 RELATÓRIO DE ATENDIMENTOS PROMOCONTROL\n`;
                txt += `Data do Relatório: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}\n`;
                txt += `========================================\n\n`;
                txt += `🟢 PROMOTORES EM ATENDIMENTO AGORA (${visitasAtivas.length}):\n`;
                
                if (visitasAtivas.length === 0) {
                    txt += `  Nenhum promotor em atendimento no momento.\n\n`;
                } else {
                    visitasAtivas.forEach(v => {
                        txt += `  • ${v.nome} (${v.empresa}) | Entrada: ${formatarHora(v.entradaIso)}\n`;
                    });
                    txt += `\n`;
                }

                txt += `🏁 ATENDIMENTOS CONCLUÍDOS (${visitasConcluidas.length}):\n`;
                if (visitasConcluidas.length === 0) {
                    txt += `  Nenhum atendimento concluído hoje.\n`;
                } else {
                    visitasConcluidas.forEach(v => {
                        txt += `  • ${v.nome} (${v.empresa}) | Ent: ${formatarHora(v.entradaIso)} | Saí: ${formatarHora(v.saidaIso)} | Perm: ${formatarDuracao(v.duracaoMs)} | Aut: ${v.responsavelSaida || 'N/A'}\n`;
                    });
                }

                return txt;
            };

            const copiarRelatorio = () => {
                navigator.clipboard.writeText(gerarTextoRelatorio());
                mostrarNotificacao("Relatório copiado para a área de transferência!");
            };

            const enviarWhatsApp = () => {
                const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(gerarTextoRelatorio())}`;
                window.open(url, '_blank');
            };

            const enviarEmail = () => {
                const url = `mailto:?subject=Relatorio%20PromoControl%20${new Date().toLocaleDateString('pt-BR')}&body=${encodeURIComponent(gerarTextoRelatorio())}`;
                window.open(url, '_blank');
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
                    <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between no-print">
                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => setMenuAberto(!menuAberto)}
                                className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition active:scale-95 border border-slate-700/60"
                            >
                                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>

                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-base shadow-md shadow-indigo-500/20">
                                    P
                                </div>
                                <div>
                                    <h1 className="font-bold text-sm tracking-tight text-white leading-tight">PromoControl</h1>
                                    <div className="flex items-center gap-1.5 text-[11px]">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                        <span className="text-emerald-400 font-medium">
                                            🔥 Firebase Sincronizado em Tempo Real
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {adminAutenticado ? (
                                <button
                                    onClick={() => { setAdminAutenticado(false); setAbaAtiva('entradas'); mostrarNotificacao('Sessão encerrada.'); }}
                                    className="px-2.5 py-1.5 rounded-xl bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 text-xs font-semibold hover:bg-indigo-500/30 transition flex items-center gap-1"
                                >
                                    <span>🔓 Admin Ativo</span>
                                    <span className="text-[10px] opacity-70">(Sair)</span>
                                </button>
                            ) : (
                                <button
                                    onClick={() => setModalAdmin({ open: true, acaoAba: 'relatorios', itemParaLixeira: null, senhaDigitada: '', erro: '', verSenha: false })}
                                    className="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-medium transition flex items-center gap-1"
                                >
                                    <IconLock className="w-3.5 h-3.5 text-amber-400" />
                                    <span>Área Admin</span>
                                </button>
                            )}
                        </div>
                    </header>

                    {notificacao && (
                        <div className="fixed bottom-5 right-5 z-50 animate-fadeIn no-print">
                            <div className="bg-slate-800 border border-indigo-500/50 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2">
                                <span className="text-emerald-400">✨</span>
                                <span>{notificacao.msg}</span>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex overflow-hidden">
                        {menuAberto && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-40 no-print" onClick={() => setMenuAberto(false)}></div>
                        )}

                        <aside className={`fixed top-0 left-0 bottom-0 w-72 bg-slate-900 border-r border-slate-800 z-50 transform transition-transform duration-200 ease-in-out flex flex-col no-print ${menuAberto ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs">P</div>
                                    <span className="font-bold text-sm text-white">Menu Principal</span>
                                </div>
                                <button onClick={() => setMenuAberto(false)} className="p-1 rounded-lg hover:bg-slate-800 text-slate-400">✕</button>
                            </div>

                            <nav className="p-3 space-y-1 flex-1">
                                <button
                                    onClick={() => tentarAcessarAba('entradas')}
                                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${abaAtiva === 'entradas' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                                >
                                    <div className="flex items-center gap-3"><IconClock /><span>Entradas e Saídas</span></div>
                                    {visitasAtivas.length > 0 && <span className="bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">{visitasAtivas.length}</span>}
                                </button>

                                <button
                                    onClick={() => tentarAcessarAba('promotores')}
                                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${abaAtiva === 'promotores' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                                >
                                    <div className="flex items-center gap-3"><IconUser /><span>Cadastrar Promotores</span></div>
                                    {!adminAutenticado ? <span className="text-amber-400 text-xs">🔒</span> : <span className="text-slate-400 text-[10px] font-bold">{promotoresDisponiveis.length}</span>}
                                </button>

                                <button
                                    onClick={() => tentarAcessarAba('responsaveis')}
                                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${abaAtiva === 'responsaveis' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                                >
                                    <div className="flex items-center gap-3"><IconShieldCheck /><span>Responsáveis e Senhas</span></div>
                                    {!adminAutenticado ? <span className="text-amber-400 text-xs">🔒</span> : <span className="text-slate-400 text-[10px] font-bold">{responsaveisDisponiveis.length}</span>}
                                </button>

                                <button
                                    onClick={() => tentarAcessarAba('relatorios')}
                                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${abaAtiva === 'relatorios' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                                >
                                    <div className="flex items-center gap-3"><IconReport /><span>Relatórios & Backup</span></div>
                                    {!adminAutenticado && <span className="text-amber-400 text-xs">🔒</span>}
                                </button>

                                <button
                                    onClick={() => tentarAcessarAba('lixeira')}
                                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${abaAtiva === 'lixeira' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                                >
                                    <div className="flex items-center gap-3"><IconTrash /><span>Lixeira</span></div>
                                    {!adminAutenticado ? <span className="text-amber-400 text-xs">🔒</span> : <span className="text-slate-400 text-[10px] font-bold">{lixeira.length}</span>}
                                </button>
                            </nav>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-900">
                            {abaAtiva === 'entradas' && (
                                <div className="max-w-4xl mx-auto space-y-6 animate-fadeIn">
                                    <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm text-slate-900">
                                        <h2 className="text-base font-bold mb-1 flex items-center gap-2">
                                            <span className="p-1.5 bg-indigo-50 text-indigo-600 rounded-lg"><IconClock /></span>
                                            Registrar Entrada de Promotor
                                        </h2>
                                        <p className="text-xs text-slate-500 mb-4">Clique abaixo para escolher o promotor (com busca rápida por Lupa).</p>

                                        {/* 🔍 SELETOR DE PROMOTOR COM BUSCA RÁPIDA (LUPA DENTRO DO SELETOR) */}
                                        <form onSubmit={handleDarEntrada} className="flex flex-col sm:flex-row gap-3">
                                            <div className="relative flex-1">
                                                <button
                                                    type="button"
                                                    onClick={() => setSeletorAberto(!seletorAberto)}
                                                    className="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-4 py-3 text-sm text-left flex items-center justify-between focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium shadow-xs"
                                                >
                                                    <span className="truncate">
                                                        {promotorSelecionadoObjeto ? (
                                                            <span>
                                                                <strong className="text-indigo-900">{promotorSelecionadoObjeto.nome}</strong> — ({promotorSelecionadoObjeto.empresa})
                                                            </span>
                                                        ) : (
                                                            <span className="text-slate-500">
                                                                -- Selecione o Promotor ({promotoresDisponiveis.length} disponíveis) --
                                                            </span>

                                </div>

                                <div className="bg-slate-50 p-3 rounded-xl border space-y-1 text-xs">
                                    <div className="font-bold text-sm">{modalSaida.visita.nome}</div>
                                    <div className="text-indigo-600 font-semibold">{modalSaida.visita.empresa}</div>
                                </div>

                                <div className="space-y-2">
                                    <label className="block text-xs font-bold uppercase flex items-center gap-1.5">
                                        <IconCamera className="text-indigo-600" />
                                        <span>1. Foto Obrigatória</span>
                                    </label>

                                    {modalSaida.fotoPreview ? (
                                        <div className="relative rounded-xl overflow-hidden border-2 border-emerald-500 bg-slate-900">
                                            <img src={modalSaida.fotoPreview} alt="Comprovação" className="w-full h-44 object-cover" />
                                            <div className="absolute bottom-2 left-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">
                                                ✓ Foto Capturada
                                            </div>
                                        </div>
                                    ) : (
                                        <button
                                            type="button"
                                            onClick={() => cameraInputRef.current && cameraInputRef.current.click()}
                                            className="w-full py-6 border-2 border-dashed border-indigo-300 bg-indigo-50 text-indigo-700 rounded-xl flex flex-col items-center justify-center gap-2 hover:bg-indigo-100 transition"
                                        >
                                            <IconCamera className="w-6 h-6" />
                                            <span className="font-bold text-xs">Clique para Tirar Foto</span>
                                        </button>
                                    )}

                                    <input
                                        type="file"
                                        ref={cameraInputRef}
                                        accept="image/*"
                                        capture="environment"
                                        onChange={handleCapturarFoto}
                                        className="hidden"
                                    />
                                </div>

                                <form onSubmit={confirmarSaida} className="space-y-4">
                                    <div className={!modalSaida.fotoBase64 ? "opacity-50 pointer-events-none" : ""}>
                                        <label className="block text-xs font-bold mb-1">2. Senha do Responsável</label>
                                        <input
                                            type="password"
                                            placeholder="Digite a senha"
                                            value={modalSaida.senhaDigitada}
                                            onChange={(e) => setModalSaida({ ...modalSaida, senhaDigitada: e.target.value, erroSenha: '' })}
                                            disabled={!modalSaida.fotoBase64}
                                            className="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-sm"
                                        />
                                    </div>

                                    {modalSaida.erroSenha && (
                                        <p className="text-xs text-rose-600 font-bold bg-rose-50 border p-2 rounded-xl">{modalSaida.erroSenha}</p>
                                    )}

                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setModalSaida({ open: false, visita: null, fotoPreview: null, fotoBase64: null, enviandoFoto: false, senhaDigitada: '', erroSenha: '', verSenha: false })}
                                            className="flex-1 bg-slate-100 text-slate-700 font-semibold py-2.5 rounded-xl text-xs"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={!modalSaida.fotoBase64}
                                            className="flex-1 bg-amber-500 disabled:bg-slate-300 text-slate-950 font-bold py-2.5 rounded-xl text-xs"
                                        >
                                            Autorizar e Encerrar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {modalFotoGeral.open && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn no-print" onClick={() => setModalFotoGeral({ open: false, url: '', nome: '' })}>
                            <div className="bg-slate-900 rounded-2xl max-w-lg w-full p-4 border border-slate-800 text-white space-y-3" onClick={(e) => e.stopPropagation()}>
                                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                    <span className="font-bold text-xs text-slate-200">📷 Comprovação: {modalFotoGeral.nome}</span>
                                    <button onClick={() => setModalFotoGeral({ open: false, url: '', nome: '' })} className="text-slate-400 hover:text-white p-1">✕</button>
                                </div>
                                <img src={modalFotoGeral.url} alt={modalFotoGeral.nome} className="w-full max-h-[70vh] object-contain rounded-xl border border-slate-800" />
                            </div>
                        </div>
                    )}

                    {modalAdmin.open && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn text-slate-900 no-print">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                                <h3 className="font-bold text-base flex items-center gap-2"><IconLock /> Acesso de Administrador</h3>
                                <form onSubmit={confirmarLoginAdmin} className="space-y-4">
                                    <input
                                        type="password"
                                        placeholder="Digite a senha de administrador"
                                        value={modalAdmin.senhaDigitada}
                                        onChange={(e) => setModalAdmin({ ...modalAdmin, senhaDigitada: e.target.value, erro: '' })}
                                        className="w-full bg-slate-50 border rounded-xl px-4 py-2.5 text-sm"
                                        autoFocus
                                    />
                                    {modalAdmin.erro && <p className="text-xs text-rose-600 font-bold">{modalAdmin.erro}</p>}
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setModalAdmin({ open: false, acaoAba: null, itemParaLixeira: null, senhaDigitada: '', erro: '', verSenha: false })}
                                            className="flex-1 bg-slate-100 py-2.5 rounded-xl text-xs font-semibold"
                                        >
                                            Cancelar
                                        </button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold">
                                            Entrar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
