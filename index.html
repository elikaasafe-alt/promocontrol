<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PromoControl - Controle de Promotores</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://apppoupe-f28c6-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const e = React.createElement;

    function App() {
      const [seletorAberto, setSeletorAberto] = React.useState(false);
      const [lojaFiltro, setLojaFiltro] = React.useState('Todas');
      const [isAdmin, setIsAdmin] = React.useState(true);
      const [modalAdmin, setModalAdmin] = React.useState(false);
      const [senhaInput, setSenhaInput] = React.useState('');

      const [promotores, setPromotores] = React.useState([]);
      const [responsaveis, setResponsaveis] = React.useState([]);
      const [visitas, setVisitas] = React.useState([]);
      const [promotorSelecionado, setPromotorSelecionado] = React.useState('');

      // Form Novos Cadastros
      const [novoPromotorNome, setNovoPromotorNome] = React.useState('');
      const [novoPromotorEmpresa, setNovoPromotorEmpresa] = React.useState('');
      const [novoResponsavelNome, setNovoResponsavelNome] = React.useState('');

      React.useEffect(() => {
        const host = window.location.hostname;
        if (host.includes('loja1')) setLojaFiltro('Loja 01');
        else if (host.includes('loja2')) setLojaFiltro('Loja 02');
        else if (host.includes('loja3')) setLojaFiltro('Loja 03');

        const promRef = db.ref('promotores');
        const respRef = db.ref('responsaveis');
        const visRef = db.ref('visitas');

        promRef.on('value', (s) => {
          const val = s.val();
          setPromotores(val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : []);
        });

        respRef.on('value', (s) => {
          const val = s.val();
          setResponsaveis(val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : []);
        });

        visRef.on('value', (s) => {
          const val = s.val();
          setVisitas(val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : []);
        });

        return () => {
          promRef.off();
          respRef.off();
          visRef.off();
        };
      }, []);

      const cadastrarPromotor = (evt) => {
        evt.preventDefault();
        if (!novoPromotorNome) return alert('Digite o nome do promotor.');
        db.ref('promotores').push({
          nome: novoPromotorNome,
          empresa: novoPromotorEmpresa || 'Geral',
          loja: lojaFiltro === 'Todas' ? 'Loja 01' : lojaFiltro,
          ativo: true
        });
        setNovoPromotorNome('');
        setNovoPromotorEmpresa('');
        alert('Promotor cadastrado com sucesso!');
      };

      const cadastrarResponsavel = (evt) => {
        evt.preventDefault();
        if (!novoResponsavelNome) return alert('Digite o nome do responsável.');
        db.ref('responsaveis').push({
          nome: novoResponsavelNome,
          loja: lojaFiltro === 'Todas' ? 'Loja 01' : lojaFiltro,
          ativo: true
        });
        setNovoResponsavelNome('');
        alert('Responsável cadastrado com sucesso!');
      };

      const promotoresDisponiveis = promotores.filter(p => 
        lojaFiltro === 'Todas' || !p.loja || p.loja === lojaFiltro
      );

      const responsaveisDisponiveis = responsaveis.filter(r => 
        lojaFiltro === 'Todas' || !r.loja || r.loja === lojaFiltro
      );

      const visitasAtivas = visitas.filter(v => 
        !v.dataSaida && (lojaFiltro === 'Todas' || v.loja === lojaFiltro)
      );

      return e('div', { className: 'min-h-screen flex flex-col bg-slate-900 text-slate-100 pb-12' },
        
        // --- HEADER ---
        e('header', { className: 'bg-slate-950 border-b border-slate-800 p-4 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-40' },
          e('div', { className: 'flex items-center gap-3' },
            e('div', { className: 'w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg' },
              e('i', { className: 'fas fa-clipboard-check' })
            ),
            e('div', null,
              e('h1', { className: 'font-bold text-base md:text-lg leading-tight' }, 'PromoControl'),
              e('span', { className: 'text-xs text-emerald-400 font-medium flex items-center gap-1' },
                e('span', { className: 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse' }),
                `Firebase Sincronizado (${lojaFiltro === 'Todas' ? 'Todas as Lojas' : lojaFiltro})`
              )
            )
          ),

          // SELETOR DE LOJA & ADMIN
          e('div', { className: 'flex items-center gap-2 relative' },
            e('div', { className: 'relative' },
              e('button', {
                onClick: () => setSeletorAberto(!seletorAberto),
                className: 'bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-200 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all'
              },
                e('span', { className: 'w-2 h-2 rounded-full bg-indigo-400' }),
                lojaFiltro === 'Todas' ? 'Todas as Lojas (Admin)' : lojaFiltro,
                e('i', { className: `fas fa-chevron-down text-xs transition-transform ${seletorAberto ? 'rotate-180' : ''}` })
              ),

              seletorAberto && e('div', { className: 'absolute right-0 mt-2 w-52 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 py-1 divide-y divide-slate-800' },
                [
                  { id: 'Loja 01', label: 'Loja 01', icon: 'fa-store' },
                  { id: 'Loja 02', label: 'Loja 02', icon: 'fa-store' },
                  { id: 'Loja 03', label: 'Loja 03', icon: 'fa-store' },
                  { id: 'Todas', label: 'Todas as Lojas (Admin)', icon: 'fa-shield-halved', isGlobal: true }
                ].map(item =>
                  e('button', {
                    key: item.id,
                    onClick: () => {
                      if (item.isGlobal && !isAdmin) setModalAdmin(true);
                      else setLojaFiltro(item.id);
                      setSeletorAberto(false);
                    },
                    className: `w-full text-left px-4 py-2.5 text-xs font-medium flex items-center gap-2 hover:bg-slate-800 ${lojaFiltro === item.id ? 'text-indigo-400 bg-slate-800/50' : 'text-slate-300'}`
                  },
                    e('i', { className: `fas ${item.icon} text-slate-400` }),
                    item.label
                  )
                )
              )
            ),

            e('button', {
              onClick: () => setIsAdmin(!isAdmin),
              className: `px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border ${isAdmin ? 'bg-indigo-600 text-white border-indigo-500 shadow-md' : 'bg-slate-800 text-slate-400 border-slate-700'}`
            },
              e('i', { className: `fas ${isAdmin ? 'fa-user-check' : 'fa-lock'}` }),
              isAdmin ? 'Admin' : 'Acesso Admin'
            )
          )
        ),

        // --- CONTEÚDO PRINCIPAL ---
        e('main', { className: 'flex-1 p-4 md:p-6 max-w-4xl mx-auto w-full space-y-6' },
          
          // 1. REGISTRAR ENTRADA
          e('div', { className: 'bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl' },
            e('h3', { className: 'font-bold text-slate-100 mb-1 flex items-center gap-2 text-base' },
              e('i', { className: 'fas fa-right-to-bracket text-indigo-400' }),
              'Registrar Entrada de Promotor'
            ),
            e('div', { className: 'flex flex-col md:flex-row gap-3 mt-3' },
              e('select', {
                value: promotorSelecionado,
                onChange: e => setPromotorSelecionado(e.target.value),
                className: 'flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs md:text-sm text-slate-200'
              },
                e('option', { value: '' }, `-- Selecione o Promotor (${promotoresDisponiveis.length} disponíveis) --`),
                promotoresDisponiveis.map(p =>
                  e('option', { key: p.id, value: p.id }, `${p.nome} (${p.empresa || 'Sem empresa'}) - ${p.loja || 'Loja 01'}`)
                )
              ),
              e('button', {
                onClick: () => {
                  if (!promotorSelecionado) return alert('Selecione um promotor primeiro.');
                  const p = promotores.find(x => x.id === promotorSelecionado);
                  db.ref('visitas').push({
                    promotorId: p.id,
                    promotorNome: p.nome,
                    empresa: p.empresa || '',
                    loja: lojaFiltro === 'Todas' ? (p.loja || 'Loja 01') : lojaFiltro,
                    dataEntrada: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                  });
                  setPromotorSelecionado('');
                  alert(`Entrada registrada para ${p.nome}!`);
                },
                className: 'bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-xl text-xs md:text-sm transition-all shadow-lg'
              },
                'Registrar Entrada'
              )
            )
          ),

          // 2. PROMOTORES EM ATENDIMENTO
          e('div', { className: 'space-y-3' },
            e('h3', { className: 'font-bold text-slate-200 text-sm flex items-center gap-2' },
              e('span', { className: 'w-2 h-2 rounded-full bg-emerald-400 animate-ping' }),
              `Promotores em Atendimento Agora (${visitasAtivas.length})`
            ),
            visitasAtivas.length === 0
              ? e('div', { className: 'bg-slate-800/40 border border-slate-800 rounded-xl p-6 text-center text-slate-500 text-xs' }, 'Nenhum promotor em atendimento no momento.')
              : e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-3' },
                  visitasAtivas.map(v =>
                    e('div', { key: v.id, className: 'bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center' },
                      e('div', null,
                        e('p', { className: 'font-bold text-slate-100 text-sm' }, v.promotorNome),
                        e('p', { className: 'text-xs text-indigo-400' }, `${v.empresa || 'Fornecedor'} • ${v.loja}`),
                        e('span', { className: 'text-[10px] text-slate-400' }, `🕒 Entrada: ${v.dataEntrada}`)
                      ),
                      e('button', {
                        onClick: () => db.ref(`visitas/${v.id}`).update({ dataSaida: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }),
                        className: 'bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-2 rounded-lg text-xs'
                      }, 'Registrar Saída')
                    )
                  )
                )
          ),

          // 3. SEÇÃO DE PROMOTORES CADASTRADOS
          e('div', { className: 'bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4' },
            e('div', { className: 'flex justify-between items-center border-b border-slate-700 pb-3' },
              e('h3', { className: 'font-bold text-slate-100 flex items-center gap-2 text-base' },
                e('i', { className: 'fas fa-users text-indigo-400' }),
                `Promotores Cadastrados (${promotoresDisponiveis.length})`
              )
            ),

            // Formulário de Cadastro de Promotor
            e('form', { onSubmit: cadastrarPromotor, className: 'grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50' },
              e('input', {
                type: 'text',
                placeholder: 'Nome do Promotor',
                value: novoPromotorNome,
                onChange: e => setNovoPromotorNome(e.target.value),
                className: 'bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200'
              }),
              e('input', {
                type: 'text',
                placeholder: 'Empresa / Fornecedor',
                value: novoPromotorEmpresa,
                onChange: e => setNovoPromotorEmpresa(e.target.value),
                className: 'bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200'
              }),
              e('button', { type: 'submit', className: 'bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-lg text-xs' },
                '+ Cadastrar Promotor'
              )
            ),

            // Lista de Promotores
            e('div', { className: 'divide-y divide-slate-700/50 max-h-60 overflow-y-auto pr-1' },
              promotoresDisponiveis.length === 0
                ? e('p', { className: 'text-xs text-slate-500 text-center py-4' }, 'Nenhum promotor cadastrado nesta loja.')
                : promotoresDisponiveis.map(p =>
                    e('div', { key: p.id, className: 'py-2.5 flex justify-between items-center' },
                      e('div', null,
                        e('p', { className: 'font-semibold text-slate-200 text-xs' }, p.nome),
                        e('p', { className: 'text-[11px] text-slate-400' }, `${p.empresa || 'Empresa não informada'} • ${p.loja || 'Loja 01'}`)
                      ),
                      e('span', { className: 'text-[10px] bg-emerald-900/60 text-emerald-300 px-2 py-0.5 rounded-full font-medium border border-emerald-700/50' }, 'Ativo')
                    )
                  )
            )
          ),

          // 4. SEÇÃO DE RESPONSÁVEIS CADASTRADOS
          e('div', { className: 'bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4' },
            e('div', { className: 'flex justify-between items-center border-b border-slate-700 pb-3' },
              e('h3', { className: 'font-bold text-slate-100 flex items-center gap-2 text-base' },
                e('i', { className: 'fas fa-user-shield text-indigo-400' }),
                `Responsáveis Cadastrados (${responsaveisDisponiveis.length})`
              )
            ),

            // Formulário de Cadastro de Responsável
            e('form', { onSubmit: cadastrarResponsavel, className: 'flex flex-col md:flex-row gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50' },
              e('input', {
                type: 'text',
                placeholder: 'Nome do Responsável / Encarregado',
                value: novoResponsavelNome,
                onChange: e => setNovoResponsavelNome(e.target.value),
                className: 'flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200'
              }),
              e('button', { type: 'submit', className: 'bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-6 rounded-lg text-xs' },
                '+ Cadastrar Responsável'
              )
            ),

            // Lista de Responsáveis
            e('div', { className: 'divide-y divide-slate-700/50 max-h-60 overflow-y-auto pr-1' },
              responsaveisDisponiveis.length === 0
                ? e('p', { className: 'text-xs text-slate-500 text-center py-4' }, 'Nenhum responsável cadastrado nesta loja.')
                : responsaveisDisponiveis.map(r =>
                    e('div', { key: r.id, className: 'py-2.5 flex justify-between items-center' },
                      e('p', { className: 'font-semibold text-slate-200 text-xs' }, r.nome),
                      e('span', { className: 'text-[10px] bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded-full font-medium border border-indigo-700/50' }, r.loja || 'Loja 01')
                    )
                  )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
