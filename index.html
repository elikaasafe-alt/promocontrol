<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromoControl</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://apppoupe-f28c6-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const e = React.createElement;

    function App() {
      const [lojaAtual, setLojaAtual] = React.useState('Loja 02');
      const [promotores, setPromotores] = React.useState([]);
      const [busca, setBusca] = React.useState('');
      const [carregando, setCarregando] = React.useState(true);

      React.useEffect(() => {
        const host = window.location.hostname;
        if (host.includes('loja1')) setLojaAtual('Loja 01');
        else if (host.includes('loja2')) setLojaAtual('Loja 02');
        else if (host.includes('loja3')) setLojaAtual('Loja 03');

        const ref = db.ref('promotores');
        ref.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const lista = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            setPromotores(lista);
          } else {
            setPromotores([]);
          }
          setCarregando(false);
        });

        return () => ref.off();
      }, []);

      const promotoresFiltrados = promotores
        .filter(p => !p.loja || p.loja === lojaAtual || lojaAtual === 'Todas')
        .filter(p => p.nome && p.nome.toLowerCase().includes(busca.toLowerCase()))
        .sort((a, b) => a.nome.localeCompare(b.nome));

      return e('div', { className: 'max-w-md mx-auto p-4 min-h-screen flex flex-col' },
        e('header', { className: 'bg-indigo-900 text-white p-4 rounded-xl shadow-lg mb-4' },
          e('div', { className: 'flex justify-between items-center' },
            e('h1', { className: 'font-bold text-xl flex items-center gap-2' },
              e('i', { className: 'fas fa-clipboard-check text-emerald-400' }),
              'PromoControl'
            ),
            e('span', { className: 'bg-indigo-800 text-emerald-300 font-semibold px-3 py-1 rounded-full text-xs border border-indigo-700' },
              lojaAtual
            )
          )
        ),
        e('div', { className: 'mb-4 relative' },
          e('input', {
            type: 'text',
            placeholder: 'Buscar promotor por nome...',
            value: busca,
            onChange: (evt) => setBusca(evt.target.value),
            className: 'w-full p-3 pl-10 rounded-xl border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500'
          }),
          e('i', { className: 'fas fa-search absolute left-3 top-3.5 text-slate-400' })
        ),
        carregando 
          ? e('div', { className: 'text-center py-10 text-slate-500' },
              e('i', { className: 'fas fa-circle-notch fa-spin text-2xl text-indigo-600 mb-2' }),
              e('p', null, 'Carregando dados da ' + lojaAtual + '...')
            )
          : e('div', { className: 'space-y-3 flex-1' },
              promotoresFiltrados.length === 0
                ? e('div', { className: 'bg-white p-6 rounded-xl text-center text-slate-500 shadow-sm border' }, 'Nenhum promotor encontrado para esta loja.')
                : promotoresFiltrados.map(p => 
                    e('div', { key: p.id, className: 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center' },
                      e('div', null,
                        e('p', { className: 'font-semibold text-slate-800' }, p.nome),
                        e('p', { className: 'text-xs text-slate-500' }, p.empresa || 'Empresa não informada')
                      ),
                      e('span', { className: 'text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800' }, 'Ativo')
                    )
                  )
            )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
