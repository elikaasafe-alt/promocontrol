<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PromoControl - Controle de Promotores</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://apppoupe-f28c6-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const e = React.createElement;

    function App() {
      const [menuAberto, setMenuAberto] = React.useState(false);
      const [seletorAberto, setSeletorAberto] = React.useState(false);
      const [abaAtiva, setAbaAtiva] = React.useState('visitas');
      const [lojaFiltro, setLojaFiltro] = React.useState('Todas');
      
      const [isAdmin, setIsAdmin] = React.useState(true);
      const [modalAdmin, setModalAdmin] = React.useState(false);
      const [senhaInput, setSenhaInput] = React.useState('');

      const [promotores, setPromotores] = React.useState([]);
      const [responsaveis, setResponsaveis] = React.useState([]);
      const [visitas, setVisitas] = React.useState([]);
      const [busca, setBusca] = React.useState('');
      const [promotorSelecionado, setPromotorSelecionado] = React.useState('');

      // Form Novos Cadastros
      const [novoPromotor, setNovoPromotor] = React.useState({ nome: '', empresa: '', loja: 'Loja 01' });
      const [novoResponsavel, setNovoResponsavel] = React.useState({ nome: '', loja: 'Loja 01' });

      React.useEffect(() => {
        const host = window.location.hostname;
        if (host.includes('loja1')) {
          setLojaFiltro('Loja 01');
          setNovoPromotor(p => ({ ...p, loja: 'Loja 01' }));
          setNovoResponsavel(r => ({ ...r, loja: 'Loja 01' }));
        } else if (host.includes('loja2')) {
          setLojaFiltro('Loja 02');
          setNovoPromotor(p => ({ ...p, loja: 'Loja 02' }));
          setNovoResponsavel(r => ({ ...r, loja: 'Loja 02' }));
        } else if (host.includes('loja3')) {
          setLojaFiltro('Loja 03');
          setNovoPromotor(p => ({ ...p, loja: 'Loja 03' }));
          setNovoResponsavel(r => ({ ...r, loja: 'Loja 03' }));
        }

        const promRef = db.ref('promotores');
        const respRef = db.ref('responsaveis');
        const visRef = db.ref('visitas');

        promRef.on('value', (s) => {
          const val = s.val();
          setPromotores(val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : []);
        });

        respRef.on('value', (s) => {
          const val = s.val();
          setResponsaveis(val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : []);
        });

        visRef.on('value', (s) => {
          const val = s.val();
          setVisitas(val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : []);
        });

        return () => {
          promRef.off();
          respRef.off();
          visRef.off();
        };
      }, []);

      const cadastrarPromotor = (evt) => {
        evt.preventDefault();
        if (!novoPromotor.nome) return alert('Digite o nome do promotor.');
        db.ref('promotores').push({ ...novoPromotor, ativo: true });
        setNovoPromotor({ nome: '', empresa: '', loja: lojaFiltro === 'Todas' ? 'Loja 01' : lojaFiltro });
        alert('Promotor cadastrado com sucesso!');
      };

      const cadastrarResponsavel = (evt) => {
        evt.preventDefault();
        if (!novoResponsavel.nome) return alert('Digite o nome do responsável.');
        db.ref('responsaveis').push({ ...novoResponsavel, ativo: true });
        setNovoResponsavel({ nome: '', loja: lojaFiltro === 'Todas' ? 'Loja 01' : lojaFiltro });
        alert('Responsável cadastrado com sucesso!');
      };

      const autenticarAdmin = (evt) => {
        evt.preventDefault();
        if (senhaInput === '1234' || senhaInput === 'admin') {
          setIsAdmin(true);
          setModalAdmin(false);
          setSenhaInput('');
          setLojaFiltro('Todas');
        } else {
          alert('Senha de administrador incorreta.');
        }
      };

      const promotoresDisponiveis = promotores
        .filter(p => lojaFiltro === 'Todas' || !p.loja || p.loja === lojaFiltro)
        .filter(p => !busca || p.nome.toLowerCase().includes(busca.toLowerCase()));

      const responsaveisDisponiveis = responsaveis.filter(r => 
        lojaFiltro === 'Todas' || !r.loja || r.loja === lojaFiltro
      );

      const visitasAtivas = visitas.filter(v => 
        !v.dataSaida && (lojaFiltro === 'Todas' || v.loja === lojaFiltro)
      );

      return e('div', { className: 'min-h-screen flex flex-col md:flex-row bg-slate-900 text-slate-100' },
        
        // --- MENU LATERAL ORIGINAL (DRAWER) ---
        e('aside', { className: `fixed md:static inset-y-0 left-0 z-50 w-64 bg-slate-950 text-white transform ${menuAberto ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between p-4 border-r border-slate-800` },
          e('div', null,
            e('div', { className: 'flex items-center justify-between pb-6 border-b border-slate-800 mb-6' },
              e('div', { className: 'flex items-center gap-3' },
                e('div', { className: 'w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-xl shadow-lg' }, 'P'),
                e('div', null,
                  e('h2', { className: 'font-bold text-lg leading-none' }, 'PromoControl'),
                  e('span', { className: 'text-xs text-indigo-400 font-medium' }, 'Gestão de Promotores')
                )
              ),
              e('button', { onClick: () => setMenuAberto(false), className: 'md:hidden text-slate-400 hover:text-white' },
                e('i', { className: 'fas fa-times text-xl' })
              )
            ),

            e('nav', { className: 'space-y-1' },
              [
                { id: 'visitas', label: 'Controle de Ponto', icon: 'fa-clipboard-user' },
                { id: 'promotores', label: 'Promotores', icon: 'fa-users' },
                { id: 'responsaveis', label: 'Responsáveis', icon: 'fa-user-shield' },
                { id: 'relatorios', label: 'Relatórios & Backup', icon: 'fa-chart-line' }
              ].map(item =>
                e('button', {
                  key: item.id,
                  onClick: () => { setAbaAtiva(item.id); setMenuAberto(false); },
                  className: `w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-colors ${abaAtiva === item.id ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`
                },
                  e('i', { className: `fas ${item.icon} w-5 text-center` }),
                  item.label
                )
              )
            )
          ),

          e('div', { className: 'pt-4 border-t border-slate-800 text-xs text-slate-500 text-center' },
            'Firebase Sincronizado'
          )
        ),

        // --- CONTEÚDO PRINCIPAL ---
        e('main', { className: 'flex-1 flex flex-col min-w-0' },
          
          // HEADER COM MENU DROPDOWN DE LOJAS E ADMIN
          e('header', { className: 'bg-slate-950 border-b border-slate-800 p-4 flex items-center justify-between sticky top-0 z-40' },
            e('div', { className: 'flex items-center gap-3' },
              e('button', { onClick: () => setMenuAberto(true), className: 'md:hidden p-2 text-slate-400 hover:bg-slate-800 rounded-lg' },
                e('i', { className: 'fas fa-bars text-xl' })
              ),
              e('h1', { className: 'font-bold text-slate-100 text-base md:text-lg capitalize' }, abaAtiva.replace('-', ' '))
            ),

            // SELETOR DROPDOWN DE LOJAS
            e('div', { className: 'flex items-center gap-2 relative' },
              e('div', { className: 'relative' },
                e('button', {
                  onClick: () => setSeletorAberto(!seletorAberto),
                  className: 'bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-200 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all'
                },
                  e('span', { className: 'w-2 h-2 rounded-full bg-indigo-400' }),
                  lojaFiltro === 'Todas' ? 'Todas as Lojas (Admin)' : lojaFiltro,
